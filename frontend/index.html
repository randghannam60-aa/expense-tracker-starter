<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">


  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm py-3">
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1 fw-bold">Expense Tracker</span>


      <button id="themeToggleBtn" class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-medium">
        🌙 Dark Mode
      </button>
    </div>
  </nav>



  <div id="loadingSpinner" class="text-center my-5 d-none">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div class="text-secondary mt-2 fw-medium">Loading expenses...</div>
  </div>

  <div class="container py-2" id="mainContent">

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>


    <div class="summary-grid mb-4">
      <div class="summary-card">
        <span class="card-label">Total</span>
        <h2 id="totalAmount" class="card-value my-1">0.00</h2>
      </div>
      <div class="summary-card">
        <span class="card-label">Number of expenses</span>
        <h2 id="expenseCount" class="card-value my-1">0</h2>
      </div>
      <div class="summary-card">
        <span class="card-label">Highest expense</span>
        <h2 id="highestExpense" class="card-value my-1">0.00</h2>
        <span id="highestExpenseTitle" class="card-subtitle text-muted">-</span>
      </div>
    </div>


    <div class="card border-0 shadow-sm p-4 mb-4" id="chartCard">
      <h5 class="fw-bold mb-3">Expenses by Category</h5>
      <div style="max-height: 280px; position: relative;">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>


    <div class="card border-0 shadow-sm p-4 mb-4" id="addFormCard">
      <h5 class="fw-bold mb-3">Add expense</h5>
      <form id="addExpenseForm" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary">Title</label>
            <input type="text" id="titleInput" class="form-control" placeholder="Lunch">
            <div class="invalid-feedback">Title is required.</div>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary">Amount</label>
            <input type="number" id="amountInput" class="form-control" step="0.01" placeholder="4.50">
            <div class="invalid-feedback">Enter an amount greater than 0.</div>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary">Category</label>
            <select id="categoryInput" class="form-select">
              <option value="" disabled selected>Choose...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <div class="invalid-feedback">Choose a category.</div>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary">Date</label>
            <input type="date" id="dateInput" class="form-control">
            <div class="invalid-feedback">Date is required.</div>
          </div>
          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary px-4">Add expense</button>
          </div>
        </div>
      </form>
    </div>


    <div class="card border-0 shadow-sm p-4" id="tableCard">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
        <h5 class="fw-bold mb-0">Expenses</h5>
        <div class="d-flex align-items-center gap-2">
          <label class="small text-secondary mb-0">Category</label>
          <select id="categoryFilter" class="form-select form-select-sm" style="width: 140px;">
            <option value="All">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expensesTableBody">

          </tbody>
        </table>
      </div>
    </div>
  </div>


  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editExpenseForm" novalidate>
            <input type="hidden" id="editExpenseId">
            <div class="mb-3">
              <label class="form-label small text-secondary">Title</label>
              <input type="text" id="editTitleInput" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">Amount</label>
              <input type="number" id="editAmountInput" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">Category</label>
              <select id="editCategoryInput" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">Date</label>
              <input type="date" id="editDateInput" class="form-control" required>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <script src="js/app.js"></script>
</body>

</html>
